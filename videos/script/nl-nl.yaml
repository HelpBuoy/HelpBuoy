# Dutch translation of en-us.yaml: only the text fields, keyed by scene id.
# Words as in the app (proto/i18n/locales/nl.json), informal "je" like the app.

meta:
  title: "Zo werkt HelpBuoy"
  lang: nl-nl

scenes:
  intro:
    text: "Hulp op afstand"
    note: "stap voor stap"
    say: "Welkom bij deze korte video. We laten stap voor stap zien hoe een gebruiker op afstand hulp kan krijgen van een techie met de computer."
  flow-parts:
    title: "Wie is wie"
    steps:
      - say: "We beginnen met wie wie is. Links zie je de gebruiker, met de app op de computer."
      - say: "Rechts zie je de techie, die de desk-app gebruikt om de gebruiker te helpen."
      - say: "En in het midden staat de server, die wij voor je kunnen beheren, zodat je zelf niets hoeft in te stellen."
      - arrows:
          - { label: "verbindt" }
          - { label: "verbindt" }
        say: "Beide apps maken verbinding met die server, maar zonder toestemming van de gebruiker kan er niets gebeuren."
  part-register:
    text: "De computer registreren"
    note: "alleen de eerste keer"
    say: "We beginnen met het registreren van de computer. Dat hoeft maar één keer te gebeuren."
  user-connect:
    say: "De gebruiker opent de app en typt het serveradres in dat de techie heeft gegeven. Daarna klikt de gebruiker op de knop \"Verbinden\"."
  user-warning:
    say: "Bij de eerste verbinding laat de app een waarschuwing zien. De gebruiker gaat alleen verder als het adres komt van iemand die bekend en vertrouwd is."
  flow-first-contact:
    title: "Eerste contact"
    steps:
      - label: "sleutel van deze computer"
        say: "De app maakt nu verbinding met de server en laat een sleutel zien die bij deze computer hoort."
      - say: "De server heeft deze sleutel nog niet eerder gezien, dus de computer moet wachten tot de techie hem registreert."
  user-key:
    say: "Intussen laat de app de sleutel van de computer zien. De gebruiker klikt op de knop \"Sleutel kopiëren\" om hem te kopiëren."
  flow-send-key:
    title: "De sleutel versturen"
    steps:
      - label: "de sleutel"
        via: "per e-mail of chat"
        say: "De gebruiker stuurt de sleutel nu naar de techie, in een e-mail of een chatbericht. De sleutel is niet geheim, dus dat kan gerust."
  techie-register:
    say: "De techie kiest dan voor \"Computer registreren\", plakt de sleutel erin en klikt op de knop \"Registreren\"."
  flow-register:
    title: "Registratie"
    steps:
      - label: "registreer deze sleutel"
        say: "De desk-app registreert de sleutel op de server, en die geldt alleen voor deze computer."
      - label: "geregistreerd"
        say: "De server laat de computer daarna weten dat hij geregistreerd is. Vanaf nu onthoudt de computer deze server."
  user-lock:
    say: "Vervolgens vraagt de app of de gebruiker alleen van deze helpdesk hulp wil krijgen. Een klik op de knop \"Vergrendelen\" bevestigt dat, en beschermt de gebruiker tegen oplichters aan de telefoon."
  part-ask:
    text: "Hulp vragen"
    note: "elke keer"
    say: "De computer is nu geregistreerd, dus laten we kijken hoe de gebruiker om hulp vraagt. Dit gebeurt elke keer als er hulp nodig is."
  flow-ask:
    title: "Hulp vragen"
    steps:
      - label: "vraagt om hulp"
        via: "per telefoon of e-mail"
        say: "Wie hulp nodig heeft, belt gewoon de techie of stuurt een e-mail."
      - label: "online"
        say: "Zolang de app open staat, kan de techie zien dat de computer van de gebruiker online is."
  user-waiting:
    say: "Tijdens het wachten laat de app het telefoonnummer en de naam van de helpdesk zien."
  techie-computers:
    say: "De techie zoekt de computer op in de lijst en klikt op de knop \"Verbinden\"."
  flow-request:
    title: "Verzoek"
    steps:
      - label: "mag ik het overnemen?"
        say: "Er gaat dan een verzoek via de server naar de computer van de gebruiker, maar er gebeurt nog niets."
  user-allow:
    say: "De app vraagt de gebruiker eerst of de techie het mag overnemen. De gebruiker klikt op de knop \"Toestaan\" om dat goed te vinden, of op de knop \"Annuleren\" om het te weigeren."
  flow-allow:
    title: "Toestemming"
    steps:
      - label: "toegestaan"
        say: "De sessie begint pas als de gebruiker op de knop \"Toestaan\" heeft geklikt."
  part-session:
    text: "Hulp krijgen"
    note: "elke keer"
    say: "Dan komen we bij de hulp zelf. De gebruiker en de techie overleggen terwijl de techie werkt, en de gebruiker houdt van begin tot eind de controle."
  techie-session:
    say: "De techie ziet nu het scherm van de gebruiker, en kan de muis en het toetsenbord gebruiken om te helpen."
  flow-session:
    title: "Tijdens de sessie"
    steps:
      - label: "schermbeeld"
        say: "Tijdens de sessie wordt een beeld van het scherm naar de techie gestuurd."
      - label: "muis en toetsenbord"
        say: "Het enige wat terugkomt, is wat de techie met de muis en het toetsenbord doet. Bestanden worden nooit verstuurd."
      - say: "De gebruiker kan op elk moment de controle terugnemen door op \"Escape\" te drukken."
      - say: "Als het werk klaar is, beëindigt de gebruiker of de techie de sessie."
  flow-summary:
    title: "Kort gezegd"
    steps:
      - arrows:
          - { label: "de sleutel", via: "één keer" }
          - { label: "registreren" }
        say: "Kort samengevat stuurt de gebruiker één keer de sleutel, en registreert de techie de computer."
      - arrows:
          - { label: "verzoek" }
          - { label: "toegestaan" }
        say: "Daarna vraagt de techie elke keer om toestemming, en beslist de gebruiker."
      - arrows:
          - { label: "schermbeeld" }
          - { label: "muis en toetsenbord" }
        say: "En tijdens een sessie worden alleen het scherm, de muis en het toetsenbord gedeeld."
  outro:
    text: "Begin vandaag nog"
    note: "www.helpbuoy.com"
    say: "En zo eenvoudig en veilig kan hulp op afstand zijn. Wil je dit ook aan je eigen klanten bieden, kijk dan op onze website en begin vandaag nog."