# Italian translation of en-us.yaml: only the text fields, keyed by scene id.
# Words as in the app (proto/i18n/locales/it.json), informal "tu" like the app.

meta:
  title: "Come funziona HelpBuoy"
  lang: it-it

scenes:
  intro:
    text: "Aiuto a distanza"
    note: "passo dopo passo"
    say: "Benvenuto in questo breve video. Ti mostriamo passo dopo passo come un utente può ricevere aiuto a distanza da un tecnico con il suo computer."
  flow-parts:
    title: "Chi è chi"
    steps:
      - say: "Cominciamo da chi è chi. A sinistra c'è l'utente, con l'app sul suo computer."
      - say: "A destra c'è il tecnico, che usa l'app desk per aiutare l'utente."
      - say: "E al centro c'è il server, che possiamo gestire noi per te, quindi non devi configurare niente."
      - arrows:
          - { label: "si connette" }
          - { label: "si connette" }
        say: "Entrambe le app si connettono a quel server, ma senza il consenso dell'utente non può succedere niente."
  part-register:
    text: "Registrare il computer"
    note: "solo la prima volta"
    say: "Cominciamo registrando il computer. È una cosa che si fa una volta sola."
  user-connect:
    say: "L'utente apre l'app e scrive l'indirizzo del server che gli ha dato il tecnico. Poi fa clic sul pulsante Connetti."
  user-warning:
    say: "Alla prima connessione, l'app mostra un avviso. L'utente continua solo se l'indirizzo gli è stato dato da qualcuno che conosce e di cui si fida."
  flow-first-contact:
    title: "Primo contatto"
    steps:
      - label: "chiave di questo computer"
        say: "Ora l'app si connette al server e gli mostra una chiave che appartiene a questo computer."
      - say: "Il server non ha mai visto questa chiave, quindi il computer deve aspettare che il tecnico la registri."
  user-key:
    say: "Nel frattempo, l'app mostra la chiave del computer. L'utente fa clic sul pulsante Copia chiave per copiarla."
  flow-send-key:
    title: "Invia la chiave"
    steps:
      - label: "la chiave"
        via: "per e-mail o in chat"
        say: "Ora l'utente invia la chiave al tecnico, in un'e-mail o in un messaggio in chat. La chiave non è segreta, quindi può inviarla in tutta sicurezza."
  techie-register:
    say: "Il tecnico sceglie quindi Registra computer, incolla la chiave e fa clic sul pulsante Registra."
  flow-register:
    title: "Registrazione"
    steps:
      - label: "registra questa chiave"
        say: "L'app desk registra la chiave sul server, ed è valida solo per questo computer."
      - label: "registrato"
        say: "Poi il server comunica al computer che è registrato. Da questo momento, il computer si ricorda di questo server."
  user-lock:
    say: "Subito dopo, l'app chiede all'utente se vuole ricevere aiuto solo da questo helpdesk. Fa clic sul pulsante Blocca per accettare, perché così è protetto dalle chiamate truffa."
  part-ask:
    text: "Chiedere aiuto"
    note: "ogni volta"
    say: "Il computer ora è registrato, quindi vediamo come l'utente chiede aiuto. È quello che fa ogni volta che ne ha bisogno."
  flow-ask:
    title: "Chiedere aiuto"
    steps:
      - label: "chiede aiuto"
        via: "per telefono o e-mail"
        say: "Quando gli serve aiuto, all'utente basta chiamare il tecnico o scrivergli un'e-mail."
      - label: "online"
        say: "Finché l'app è aperta, il tecnico può vedere che il computer dell'utente è online."
  user-waiting:
    say: "Mentre l'utente aspetta, l'app mostra il numero di telefono e il nome dell'helpdesk."
  techie-computers:
    say: "Il tecnico trova il computer nell'elenco e fa clic sul pulsante Connetti."
  flow-request:
    title: "Richiesta"
    steps:
      - label: "posso prendere il controllo?"
        say: "A quel punto una richiesta passa attraverso il server e arriva al computer dell'utente, ma non succede ancora niente."
  user-allow:
    say: "L'app chiede prima all'utente se il tecnico può prendere il controllo. Fa clic sul pulsante Consenti se è d'accordo, oppure sul pulsante Annulla se non lo è."
  flow-allow:
    title: "Consenso"
    steps:
      - label: "consentito"
        say: "La sessione inizia solo dopo che l'utente ha fatto clic sul pulsante Consenti."
  part-session:
    text: "Ricevere aiuto"
    note: "ogni volta"
    say: "Arriviamo così all'aiuto vero e proprio. L'utente e il tecnico si parlano mentre il tecnico lavora, e il controllo resta all'utente dall'inizio alla fine."
  techie-session:
    say: "Ora il tecnico vede lo schermo dell'utente, e può usare il mouse e la tastiera per aiutarlo."
  flow-session:
    title: "Durante la sessione"
    steps:
      - label: "immagine dello schermo"
        say: "Durante la sessione, un'immagine dello schermo viene inviata al tecnico."
      - label: "mouse e tastiera"
        say: "L'unica cosa che torna indietro è quello che il tecnico fa con il mouse e la tastiera. I file non vengono mai inviati."
      - say: "L'utente può riprendere il controllo in qualsiasi momento premendo il tasto Esc."
      - say: "A lavoro finito, l'utente o il tecnico termina la sessione."
  flow-summary:
    title: "In breve"
    steps:
      - arrows:
          - { label: "la chiave", via: "una volta" }
          - { label: "registra" }
        say: "Riassumendo, l'utente invia la chiave una volta sola, e il tecnico registra il computer."
      - arrows:
          - { label: "richiesta" }
          - { label: "consentito" }
        say: "Da quel momento, il tecnico chiede ogni volta il permesso, e decide l'utente."
      - arrows:
          - { label: "immagine dello schermo" }
          - { label: "mouse e tastiera" }
        say: "E durante una sessione vengono condivisi solo lo schermo, il mouse e la tastiera."
  outro:
    text: "Inizia oggi stesso"
    note: "www.helpbuoy.com"
    say: "Ed ecco quanto può essere semplice e sicuro l'aiuto a distanza. Se vuoi offrirlo ai tuoi clienti, visita il nostro sito web e inizia oggi stesso."