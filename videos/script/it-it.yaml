# Italian translation of en-us.yaml: only the text fields, keyed by scene id.
# Words as in the app (proto/i18n/locales/it.json), informal "tu" like the app.

meta:
  title: "Come funziona HelpBuoy"
  lang: it-it

scenes:
  intro:
    text: "Aiuto sul tuo computer"
    note: "passo dopo passo"
    say: "Benvenuto in questo breve video. Ti mostriamo passo dopo passo come un tecnico può aiutarti a distanza con il tuo computer."
  flow-parts:
    title: "Chi è chi"
    steps:
      - say: "Cominciamo da chi è chi. A sinistra ci sei tu, con l'app sul tuo computer."
      - say: "A destra c'è il tuo tecnico, che usa l'app desk per aiutarti."
      - say: "E al centro c'è il server, che gestiamo noi per te, quindi non devi configurare niente."
      - arrows:
          - { label: "si connette" }
          - { label: "si connette" }
        say: "Entrambe le app si connettono a quel server, ma senza il tuo consenso non può succedere niente."
  part-register:
    text: "Registra il tuo computer"
    note: "solo la prima volta"
    say: "Cominciamo registrando il tuo computer. È una cosa che fai una volta sola."
  user-connect:
    say: "Apri l'app e scrivi l'indirizzo del server che ti ha dato il tuo tecnico. Poi fai clic sul pulsante Connetti."
  user-warning:
    say: "La prima volta che ti connetti, l'app ti mostra un avviso. Continua solo se l'indirizzo ti è stato dato da qualcuno che conosci e di cui ti fidi."
  flow-first-contact:
    title: "Primo contatto"
    steps:
      - label: "chiave di questo computer"
        say: "Ora l'app si connette al server e gli mostra una chiave che appartiene al tuo computer."
      - say: "Il server non ha mai visto questa chiave, quindi il tuo computer deve aspettare che il tuo tecnico la registri."
  user-key:
    say: "Nel frattempo, l'app ti mostra la chiave del tuo computer. Fai clic sul pulsante Copia chiave per copiarla."
  flow-send-key:
    title: "Invia la chiave"
    steps:
      - label: "la tua chiave"
        via: "per e-mail o in chat"
        say: "Ora invia la chiave al tuo tecnico, in un'e-mail o in un messaggio in chat. La chiave non è segreta, quindi puoi inviarla in tutta sicurezza."
  techie-register:
    say: "Il tuo tecnico sceglie quindi Registra computer, incolla la tua chiave e fa clic sul pulsante Registra."
  flow-register:
    title: "Registrazione"
    steps:
      - label: "registra questa chiave"
        say: "L'app desk registra la tua chiave sul server, ed è valida solo per il tuo computer."
      - label: "registrato"
        say: "Poi il server comunica al tuo computer che è registrato. Da questo momento, il tuo computer si ricorda di questo server."
  user-lock:
    say: "Subito dopo, l'app ti chiede se vuoi ricevere aiuto solo da questo helpdesk. Fai clic sul pulsante Blocca per accettare, perché così sei protetto dalle chiamate truffa."
  part-ask:
    text: "Chiedi aiuto"
    note: "ogni volta"
    say: "Il tuo computer ora è registrato, quindi vediamo come chiedere aiuto. È quello che fai ogni volta che ne hai bisogno."
  flow-ask:
    title: "Chiedi aiuto"
    steps:
      - label: "chiede aiuto"
        via: "per telefono o e-mail"
        say: "Quando ti serve aiuto, basta chiamare il tuo tecnico o scrivergli un'e-mail."
      - label: "online"
        say: "Finché l'app è aperta, il tuo tecnico può vedere che il tuo computer è online."
  user-waiting:
    say: "Mentre aspetti, l'app ti mostra il numero di telefono e il nome del tuo helpdesk."
  techie-computers:
    say: "Il tuo tecnico trova il tuo computer nell'elenco e fa clic sul pulsante Connetti."
  flow-request:
    title: "Richiesta"
    steps:
      - label: "posso prendere il controllo?"
        say: "A quel punto una richiesta passa attraverso il server e arriva al tuo computer, ma non succede ancora niente."
  user-allow:
    say: "L'app ti chiede prima se il tuo tecnico può prendere il controllo. Fai clic sul pulsante Consenti se sei d'accordo, oppure sul pulsante Annulla se non lo sei."
  flow-allow:
    title: "Consenso"
    steps:
      - label: "consentito"
        say: "La sessione inizia solo dopo che hai fatto clic sul pulsante Consenti."
  part-session:
    text: "La sessione"
    note: "finché non la fermi tu"
    say: "Arriviamo così alla sessione vera e propria. Il controllo resta tuo dall'inizio alla fine."
  techie-session:
    say: "Ora il tuo tecnico vede il tuo schermo, e può usare il mouse e la tastiera per aiutarti."
  flow-session:
    title: "Durante la sessione"
    steps:
      - label: "immagine dello schermo"
        say: "Durante la sessione, un'immagine del tuo schermo viene inviata al tuo tecnico."
      - label: "mouse e tastiera"
        say: "L'unica cosa che torna indietro è quello che il tuo tecnico fa con il mouse e la tastiera. I tuoi file non vengono mai inviati."
      - say: "Puoi riprendere il controllo in qualsiasi momento premendo il tasto Esc."
      - say: "A lavoro finito, tu o il tuo tecnico terminate la sessione."
  flow-summary:
    title: "In breve"
    steps:
      - arrows:
          - { label: "la tua chiave", via: "una volta" }
          - { label: "registra" }
        say: "Riassumendo, invii la tua chiave una volta sola, e il tuo tecnico registra il tuo computer."
      - arrows:
          - { label: "richiesta" }
          - { label: "consentito" }
        say: "Da quel momento, il tuo tecnico ti chiede ogni volta il permesso, e decidi tu."
      - arrows:
          - { label: "immagine dello schermo" }
          - { label: "mouse e tastiera" }
        say: "E durante una sessione vengono condivisi solo il tuo schermo, il mouse e la tastiera."
  outro:
    text: "Inizia oggi stesso"
    note: "www.helpbuoy.com"
    say: "Ed ecco quanto può essere semplice e sicuro l'aiuto a distanza. Se vuoi offrirlo ai tuoi clienti, visita il nostro sito web e inizia oggi stesso."