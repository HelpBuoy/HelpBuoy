# Spanish translation of en-us.yaml: only the text fields, keyed by scene id.
# Words as in the app (proto/i18n/locales/es.json), informal "tú" like the app.

meta:
  title: "Cómo funciona HelpBuoy"
  lang: es-es

scenes:
  intro:
    text: "Ayuda a distancia"
    note: "paso a paso"
    say: "Te damos la bienvenida a este breve vídeo. Vamos a enseñarte paso a paso cómo un usuario puede recibir ayuda a distancia de un técnico con su equipo."
  flow-parts:
    title: "Quién es quién"
    steps:
      - say: "Empecemos por ver quién es quién. A la izquierda está el usuario, con la app en su equipo."
      - say: "A la derecha está el técnico, que usa la app desk para ayudar al usuario."
      - say: "Y en el centro está el servidor, del que podemos encargarnos nosotros, así que no tienes que configurar nada."
      - arrows:
          - { label: "se conecta" }
          - { label: "se conecta" }
        say: "Las dos apps se conectan a ese servidor, pero no puede pasar nada sin el permiso del usuario."
  part-register:
    text: "Registrar el equipo"
    note: "solo la primera vez"
    say: "Empecemos por registrar el equipo. Esto solo hay que hacerlo una vez."
  user-connect:
    say: "El usuario abre la app y escribe la dirección del servidor que le ha dado el técnico. Después, hace clic en el botón \"Conectar\"."
  user-warning:
    say: "La primera vez que se conecta, la app le muestra un aviso. El usuario solo continúa si la dirección se la ha dado alguien a quien conoce y en quien confía."
  flow-first-contact:
    title: "Primer contacto"
    steps:
      - label: "clave de este equipo"
        say: "Ahora la app se conecta al servidor y le muestra una clave que pertenece a este equipo."
      - say: "El servidor nunca ha visto esta clave, así que el equipo tiene que esperar hasta que el técnico la registre."
  user-key:
    say: "Mientras tanto, la app muestra la clave del equipo. El usuario hace clic en el botón \"Copiar clave\" para copiarla."
  flow-send-key:
    title: "Enviar la clave"
    steps:
      - label: "la clave"
        via: "por correo o chat"
        say: "Ahora el usuario envía la clave al técnico, en un correo o en un mensaje de chat. La clave no es secreta, así que puede enviarla con total tranquilidad."
  techie-register:
    say: "El técnico elige entonces \"Registrar equipo\", pega la clave y hace clic en el botón \"Registrar\"."
  flow-register:
    title: "Registro"
    steps:
      - label: "registrar esta clave"
        say: "La app desk registra la clave en el servidor, y solo es válida para este equipo."
      - label: "registrado"
        say: "Después, el servidor avisa al equipo de que ya está registrado. A partir de ahora, el equipo recuerda este servidor."
  user-lock:
    say: "A continuación, la app pregunta al usuario si quiere recibir ayuda solo de este servicio de soporte. Hace clic en el botón \"Bloquear\" para aceptar, porque así se protege de las llamadas fraudulentas."
  part-ask:
    text: "Pedir ayuda"
    note: "cada vez"
    say: "El equipo ya está registrado, así que vamos a ver cómo pide ayuda el usuario. Esto es lo que hace cada vez que la necesita."
  flow-ask:
    title: "Pedir ayuda"
    steps:
      - label: "pide ayuda"
        via: "por teléfono o correo"
        say: "Cuando el usuario necesita ayuda, le basta con llamar al técnico o escribirle un correo."
      - label: "en línea"
        say: "Mientras la app esté abierta, el técnico puede ver que el equipo del usuario está en línea."
  user-waiting:
    say: "Mientras el usuario espera, la app muestra el teléfono y el nombre del servicio de soporte."
  techie-computers:
    say: "El técnico busca el equipo en la lista y hace clic en el botón \"Conectar\"."
  flow-request:
    title: "Solicitud"
    steps:
      - label: "¿puedo tomar el control?"
        say: "Entonces llega una solicitud al equipo del usuario a través del servidor, pero todavía no pasa nada."
  user-allow:
    say: "La app pregunta primero al usuario si el técnico puede tomar el control. Hace clic en el botón \"Permitir\" si está de acuerdo, o en el botón \"Cancelar\" si no lo está."
  flow-allow:
    title: "Permiso"
    steps:
      - label: "permitido"
        say: "La sesión solo empieza cuando el usuario ha hecho clic en el botón \"Permitir\"."
  part-session:
    text: "Recibir ayuda"
    note: "cada vez"
    say: "Y así llegamos a la ayuda en sí. El usuario y el técnico hablan mientras el técnico trabaja, y el usuario mantiene el control de principio a fin."
  techie-session:
    say: "Ahora el técnico ve la pantalla del usuario, y puede usar el ratón y el teclado para ayudarle."
  flow-session:
    title: "Durante la sesión"
    steps:
      - label: "imagen de pantalla"
        say: "Durante la sesión, se envía al técnico una imagen de la pantalla."
      - label: "ratón y teclado"
        say: "Lo único que vuelve es lo que el técnico hace con el ratón y el teclado. Los archivos nunca se envían."
      - say: "El usuario puede recuperar el control en cualquier momento pulsando \"Escape\"."
      - say: "Cuando termina el trabajo, el usuario o el técnico cierra la sesión."
  flow-summary:
    title: "En resumen"
    steps:
      - arrows:
          - { label: "la clave", via: "una vez" }
          - { label: "registrar" }
        say: "En resumen, el usuario envía la clave una sola vez, y el técnico registra el equipo."
      - arrows:
          - { label: "solicitud" }
          - { label: "permitido" }
        say: "A partir de ahí, el técnico pide permiso cada vez, y el usuario decide."
      - arrows:
          - { label: "imagen de pantalla" }
          - { label: "ratón y teclado" }
        say: "Y durante una sesión, solo se comparten la pantalla, el ratón y el teclado."
  outro:
    text: "Empieza hoy mismo"
    note: "www.helpbuoy.com"
    say: "Y así de fácil y segura puede ser la ayuda a distancia. Si quieres ofrecérsela a tus propios clientes, visita nuestra web y empieza hoy mismo."