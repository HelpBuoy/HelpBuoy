# Nodes of the animated flow diagrams, on the 1280x720 canvas.
#
# icon: a <symbol> id from docs/helpbuoy.connection.diagram.svg (user, techie,
#       pc, laptop, server, chat, lock, buoy), so the video matches the docs.
# color: colour of the arrows this node sends (a name from config.yaml colors).
# label, sub: two lines under the icon, per language.
#
# The top row are the people (things they send each other go outside
# the apps), the bottom row the apps, with the server in between.
#
# The badge of a screen scene uses the label of the actor's node and the label
# of its app node (badge_app).

nodes:
  user:
    x: 250
    y: 215
    icon: user
    scale: 1.3
    color: red
    badge_app: client
    label:
      en-us: "Computer user"
      nl-nl: "Computergebruiker"
      de-de: "Computerbenutzer"
      fr-fr: "Utilisateur"
      es-es: "Usuario"
      it-it: "Utente"
    sub:
      en-us: "needs help"
      nl-nl: "heeft hulp nodig"
      de-de: "braucht Hilfe"
      fr-fr: "a besoin d'aide"
      es-es: "necesita ayuda"
      it-it: "ha bisogno di aiuto"

  client:
    x: 250
    y: 425
    icon: pc
    scale: 1.3
    color: red
    label:
      en-us: "App"
      nl-nl: "App"
      de-de: "App"
      fr-fr: "Appli"
      es-es: "App"
      it-it: "App"
    sub:
      en-us: "on the user's computer"
      nl-nl: "op de computer"
      de-de: "auf dem Computer"
      fr-fr: "sur l'ordinateur"
      es-es: "en el equipo"
      it-it: "sul computer"

  techie:
    x: 1030
    y: 215
    icon: techie
    scale: 1.3
    color: navy
    badge_app: desk
    label:
      en-us: "Techie"
      nl-nl: "Techie"
      de-de: "Techniker"
      fr-fr: "Technicien"
      es-es: "Técnico"
      it-it: "Tecnico"
    sub:
      en-us: "helps"
      nl-nl: "helpt"
      de-de: "hilft"
      fr-fr: "aide"
      es-es: "ayuda"
      it-it: "aiuta"

  desk:
    x: 1030
    y: 425
    icon: laptop
    scale: 1.3
    color: navy
    label:
      en-us: "Desk app"
      nl-nl: "Desk-app"
      de-de: "Desk-App"
      fr-fr: "Appli desk"
      es-es: "App desk"
      it-it: "App desk"
    sub:
      en-us: "for the techie"
      nl-nl: "van de techie"
      de-de: "des Technikers"
      fr-fr: "du technicien"
      es-es: "del técnico"
      it-it: "del tecnico"

  server:
    x: 640
    y: 470
    icon: server
    scale: 1.3
    color: amber
    label:
      en-us: "Server"
      nl-nl: "Server"
      de-de: "Server"
      fr-fr: "Serveur"
      es-es: "Servidor"
      it-it: "Server"
    sub:
      en-us: "we can run it for you"
      nl-nl: "kunnen wij beheren"
      de-de: "können wir betreiben"
      fr-fr: "nous pouvons le gérer"
      es-es: "podemos gestionarlo"
      it-it: "possiamo gestirlo noi"

# Arrows with a "via" go outside the apps (email, phone, chat). They are drawn
# dashed in this colour, whoever sends them.
outside_color: amber
